  sheet: Search Runs

principles:
  - GitHub stores canonical search intent, priority, and query definitions.
  - Google Sheets stores actual execution history and result counts.
  - Search for high recall first; source quality affects later ranking, not discovery eligibility.
  - Do not create a nutrition row from a search snippet if the source page cannot confirm the number.
  - Preserve conflicting observations by source, date, market, and serving basis; never average them.

