name: Import DailyDietitian candidates

on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: Optional article limit; 0 means all discovered articles
        required: false
        default: "0"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/dailydietitian-import.yml
      - config/dailydietitian-sources.json
      - docs/DAILYDIETITIAN_IMPORT.md
      - package.json
      - scripts/import-dailydietitian.mjs
      - scripts/lib/dailydietitian.mjs
      - tests/dailydietitian-import.test.mjs

permissions:
  contents: write

concurrency:
  group: dailydietitian-import-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DAILYDIETITIAN_MAX_CATEGORY_PAGES: "8"
      DAILYDIETITIAN_MAX_ARTICLES: ${{ inputs.max_articles || '0' }}
      DAILYDIETITIAN_REQUEST_DELAY_MS: "850"
      IMPORT_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMPORT_BRANCH }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crawl, compare, and generate draft candidates
        run: npm run import:dailydietitian

      - name: Reject empty or blocked crawl results
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const summary = JSON.parse(await readFile("reports/dailydietitian/summary.json", "utf8"));
          if (summary.article_links_discovered < 10 || summary.articles_processed < 10 || summary.candidates_extracted < 1) {
            throw new Error(`Unsafe crawl result; refusing to replace reports: ${JSON.stringify(summary)}`);
          }
          NODE

      - name: Normalize OKF v0.2 documents
        run: npm run format:okf

      - name: Validate all OKF data
        run: npm run validate:data

      - name: Run regression tests
        run: npm test

      - name: Commit generated discovery data and drafts
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            references/discovery/dailydietitian \
            reports/dailydietitian \
            knowledge/menu-items/dailydietitian-verified \
            knowledge/index.md \
            knowledge/log.md \
            knowledge/menu-items/index.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "data: import DailyDietitian candidates [skip ci]"
          git fetch origin "${IMPORT_BRANCH}"
          git rebase "origin/${IMPORT_BRANCH}"
          git push origin "HEAD:${IMPORT_BRANCH}"
