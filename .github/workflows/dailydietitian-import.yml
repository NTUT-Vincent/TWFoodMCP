name: Import DailyDietitian candidates

on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: Optional article limit; 0 means all discovered articles
        required: false
        default: "0"
  push:
    branches:
      - feat/dailydietitian-import-pipeline-20260802
    paths:
      - .github/workflows/dailydietitian-import.yml

permissions:
  contents: write

concurrency:
  group: dailydietitian-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DAILYDIETITIAN_MAX_CATEGORY_PAGES: "8"
      DAILYDIETITIAN_MAX_ARTICLES: ${{ inputs.max_articles || '0' }}
      DAILYDIETITIAN_REQUEST_DELAY_MS: "850"

    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crawl, compare, and generate draft candidates
        run: npm run import:dailydietitian

      - name: Normalize OKF v0.2 documents
        run: npm run format:okf

      - name: Validate all OKF data
        run: npm run validate:data

      - name: Run regression tests
        run: npm test

      - name: Commit generated discovery data and drafts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            references/discovery/dailydietitian \
            reports/dailydietitian \
            knowledge/menu-items/dailydietitian-verified \
            knowledge/index.md \
            knowledge/log.md \
            knowledge/menu-items/index.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "data: import DailyDietitian candidates [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
