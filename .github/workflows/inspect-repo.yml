name: Inspect repository snapshot

on:
  pull_request:
    paths:
      - .github/workflows/inspect-repo.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create complete repository archive
        run: tar --exclude=.git -czf /tmp/repository.tar.gz .
      - name: Upload repository archive
        uses: actions/upload-artifact@v4
        with:
          name: repository-inspection
          path: /tmp/repository.tar.gz
          if-no-files-found: error
          retention-days: 1
