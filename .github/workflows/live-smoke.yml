name: live-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://okf-mcp.vincent930093.workers.dev
    steps:
      - name: Wait for health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            echo "Attempt $i/30"
            body=$(curl -fsS --max-time 10 "$BASE_URL/health" 2>/tmp/curl-error || true)
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q '"service":"TWFoodMCP"'; then
              echo "$body"
              exit 0
            fi
            if [ -n "$body" ]; then
              echo "Unexpected response: $body"
            elif [ -s /tmp/curl-error ]; then
              cat /tmp/curl-error
            fi
            sleep 10
          done
          echo "Health endpoint did not become ready" >&2
          exit 1

      - name: Test root and dataset endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$BASE_URL/" | tee /tmp/root.json
          grep -q '"mcp":"/mcp"' /tmp/root.json

          curl -fsS --max-time 15 "$BASE_URL/dataset" | tee /tmp/dataset.json
          grep -q '"dataset_channel":"stable"' /tmp/dataset.json
          grep -q '"dataset_version"' /tmp/dataset.json

          curl -fsS --max-time 15 "$BASE_URL/dataset?channel=preview" | tee /tmp/preview-dataset.json
          grep -q '"dataset_channel":"preview"' /tmp/preview-dataset.json
          grep -q '"preview_documents"' /tmp/preview-dataset.json

      - name: Test MCP initialize
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 \
            -X POST "$BASE_URL/mcp" \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-smoke-test","version":"1.0.0"}}}' \
            | tee /tmp/initialize.json
          grep -q '"name":"TWFoodMCP"' /tmp/initialize.json
          grep -q '"protocolVersion":"2025-06-18"' /tmp/initialize.json

      - name: Test MCP tools list and ping
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 \
            -X POST "$BASE_URL/mcp" \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | tee /tmp/tools.json
          grep -q '"name":"search_food"' /tmp/tools.json
          grep -q '"name":"create_draft"' /tmp/tools.json

          curl -fsS --max-time 15 \
            -X POST "$BASE_URL/mcp" \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":3,"method":"ping","params":{}}' \
            | tee /tmp/ping.json
          grep -q '"result":{}' /tmp/ping.json

      - name: Test McDonald's preview search
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 \
            -X POST "$BASE_URL/mcp" \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"search_food","arguments":{"query":"大麥克","brand":"McDonald\u0027s","dataset_channel":"preview","limit":10}}}' \
            | tee /tmp/mcdonalds-preview.json
          grep -q 'food:tw:menu:mcdonalds:big-mac' /tmp/mcdonalds-preview.json
          grep -q '"status":"draft"' /tmp/mcdonalds-preview.json
