name: Apply search-all patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .patches/search-all.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-all-records-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare one-time patch script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-search-all-patch.mjs')
          source = path.read_text()
          old = '    if (!food) throw new Error(`food was not found for status filter ${status}`);'
          new = '    if (!food) throw new Error("food was not found for status filter " + status);'
          if source.count(old) != 1:
              raise SystemExit('expected one nested template literal')
          source = source.replace(old, new)
          start = source.index("const workflowPath = '.github/workflows/publish-dataset.yml';")
          end = source.index("console.log('Applied default all-status discovery patch.');", start)
          source = source[:start] + source[end:]
          path.write_text(source)
          PY
      - run: node .github/scripts/apply-search-all-patch.mjs
      - name: Commit patched runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .patches/search-all.trigger
          git add worker/src/index.ts package.json
          git diff --cached --check
          git commit -m "feat: discover stable and draft foods by default [skip ci]"
          git push origin HEAD:feat/search-all-records-20260802
