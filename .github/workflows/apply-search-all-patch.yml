name: Apply search-all patch

on:
  push:
    branches:
      - feat/search-all-records-20260802
    paths:
      - .patches/search-all.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-all-records-20260802
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/apply-search-all-patch.mjs
      - name: Commit patched runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.ts package.json .github/workflows/publish-dataset.yml
          git diff --cached --check
          git commit -m "feat: discover stable and draft foods by default [skip ci]"
          git push origin HEAD:feat/search-all-records-20260802
