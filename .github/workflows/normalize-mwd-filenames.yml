name: normalize-mwd-okf-filenames

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/normalize-mwd-filenames.mjs"
      - ".github/workflows/normalize-mwd-filenames.yml"

permissions:
  contents: write
  statuses: write

concurrency:
  group: normalize-mwd-okf-filenames
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_BASE_URL: https://okf-mcp.vincent930093.workers.dev
    steps:
      - name: Mark filename normalization pending
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=mwd-filenames \
            -f description="Normalizing MWD OKF concept filenames" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Make filename normalization part of every MWD format pass
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = "package.json";
          const pkg = JSON.parse(await readFile(path, "utf8"));
          pkg.scripts["format:okf"] = "node scripts/format-okf-v0.2.mjs && node scripts/normalize-mwd-filenames.mjs && node scripts/update-mwd-indexes.mjs";
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`, "utf8");
          NODE

      - name: Normalize filenames and rebuild indexes
        run: npm run format:okf

      - name: Verify filename convention
        shell: bash
        run: |
          set -euo pipefail
          count="$(find knowledge/menu-items/mwd -mindepth 2 -maxdepth 2 -type f -name '*.md' ! -name 'index.md' ! -name 'log.md' | wc -l | tr -d ' ')"
          test "$count" -eq 81
          if find knowledge/menu-items/mwd -mindepth 2 -maxdepth 2 -type f -name 'mwd-*.md' | grep -q .; then
            echo "Legacy mwd-<id>.md filenames remain." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readdir } from "node:fs/promises";
          import path from "node:path";
          const root = "knowledge/menu-items/mwd";
          let checked = 0;
          for (const category of await readdir(root, { withFileTypes: true })) {
            if (!category.isDirectory()) continue;
            for (const file of await readdir(path.join(root, category.name))) {
              if (file === "index.md" || file === "log.md" || !file.endsWith(".md")) continue;
              if (!/-\d+\.md$/u.test(file)) throw new Error(`Invalid MWD filename: ${category.name}/${file}`);
              checked += 1;
            }
          }
          if (checked !== 81) throw new Error(`Expected 81 concepts, found ${checked}`);
          console.log(`Verified ${checked} descriptive MWD filenames.`);
          NODE

      - name: Validate OKF bundle and tests
        run: |
          npm run validate:data
          npm test

      - name: Commit normalized bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json knowledge/menu-items/mwd
          if git diff --cached --quiet; then
            echo "No filename changes to commit."
          else
            git commit -m "chore(okf): normalize MWD concept filenames"
            git push
          fi
          echo "DATASET_VERSION=git-$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check Cloudflare credentials
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare credentials are required to republish renamed concept paths."
            exit 1
          fi

      - name: Build and publish D1 dataset
        run: |
          npm run build:dataset
          npm run migrate:dataset
          npm run publish:dataset

      - name: Deploy Worker
        run: npm run deploy

      - name: Verify production preview
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(cat dist/d1/current-version.txt)"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$PRODUCTION_BASE_URL/dataset?channel=preview" > /tmp/mwd-filename-preview.json; then
              if EXPECTED_VERSION="$expected_version" node --input-type=module -e '
                import fs from "node:fs";
                const body = JSON.parse(fs.readFileSync("/tmp/mwd-filename-preview.json", "utf8"));
                if (body.dataset_channel !== "preview") process.exit(1);
                if (body.dataset_version !== process.env.EXPECTED_VERSION) process.exit(1);
              '; then break; fi
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "Preview dataset did not converge to $expected_version" >&2
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error \
            -X POST "$PRODUCTION_BASE_URL/mcp" \
            -H "content-type: application/json" \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"search_food","arguments":{"query":"麥味登","brand":"麥味登","dataset_channel":"preview","limit":5}}}' \
            > /tmp/mwd-filename-search.json
          node --input-type=module -e '
            import fs from "node:fs";
            const body = JSON.parse(fs.readFileSync("/tmp/mwd-filename-search.json", "utf8"));
            const results = body?.result?.structuredContent?.results;
            if (!Array.isArray(results) || results.length < 1) throw new Error("Production MWD search returned no records");
          '

      - name: Mark filename normalization successful
        if: ${{ success() }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=mwd-filenames \
            -f description="MWD OKF filenames normalized and deployed" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Mark filename normalization failed
        if: ${{ failure() }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=mwd-filenames \
            -f description="MWD OKF filename normalization failed" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
