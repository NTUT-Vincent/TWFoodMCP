name: verify-production-sync-final

on:
  push:
    branches:
      - main
    paths:
      - ".github/production-sync-final-trigger"

permissions:
  contents: write

concurrency:
  group: production-dataset
  cancel-in-progress: true

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATASET_VERSION: git-${{ github.sha }}
      PRODUCTION_BASE_URL: https://okf-mcp.vincent930093.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate:data
      - run: npm run check:links
      - run: npm test
      - run: npm run build:dataset

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Publish current main dataset and deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          npm run migrate:dataset
          npm run publish:dataset
          npm run deploy

      - name: Verify production dataset and MCP readback
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(cat dist/d1/current-version.txt)"
          expected_count="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("dist/d1/manifest.json", "utf8")).stable_documents)')"
          expected_preview_count="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("dist/d1/preview-manifest.json", "utf8")).preview_documents)')"

          for attempt in {1..12}; do
            stable_ok=false
            preview_ok=false
            if curl --fail --silent --show-error "$PRODUCTION_BASE_URL/dataset" > /tmp/stable.json; then
              if EXPECTED_VERSION="$expected_version" EXPECTED_COUNT="$expected_count" node --input-type=module -e '
                import fs from "node:fs";
                const body = JSON.parse(fs.readFileSync("/tmp/stable.json", "utf8"));
                if (body.dataset_channel !== "stable" || body.dataset_version !== process.env.EXPECTED_VERSION || body.stable_documents !== Number(process.env.EXPECTED_COUNT)) process.exit(1);
              '; then stable_ok=true; fi
            fi
            if curl --fail --silent --show-error "$PRODUCTION_BASE_URL/dataset?channel=preview" > /tmp/preview.json; then
              if EXPECTED_VERSION="$expected_version" EXPECTED_PREVIEW_COUNT="$expected_preview_count" node --input-type=module -e '
                import fs from "node:fs";
                const body = JSON.parse(fs.readFileSync("/tmp/preview.json", "utf8"));
                if (body.dataset_channel !== "preview" || body.dataset_version !== process.env.EXPECTED_VERSION || body.preview_documents !== Number(process.env.EXPECTED_PREVIEW_COUNT)) process.exit(1);
              '; then preview_ok=true; fi
            fi
            if [[ "$stable_ok" == true && "$preview_ok" == true ]]; then break; fi
            if [[ "$attempt" == 12 ]]; then exit 1; fi
            sleep 10
          done

          curl --fail --silent --show-error -X POST "$PRODUCTION_BASE_URL/mcp" \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"production-sync-verifier","version":"1.0.0"}}}' \
            > /tmp/init.json
          grep -q '"name":"TWFoodMCP"' /tmp/init.json

          curl --fail --silent --show-error -X POST "$PRODUCTION_BASE_URL/mcp" \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"search_food","arguments":{"query":"Fami","limit":10}}}' \
            > /tmp/stable-search.json
          EXPECTED_VERSION="$expected_version" node --input-type=module -e '
            import fs from "node:fs";
            const body = JSON.parse(fs.readFileSync("/tmp/stable-search.json", "utf8"));
            const content = body?.result?.structuredContent;
            if (content?.dataset_version !== process.env.EXPECTED_VERSION) throw new Error("stable search dataset version mismatch");
            if (!Array.isArray(content?.results) || content.results.length < 1) throw new Error("stable search returned no results");
          '

          curl --fail --silent --show-error -X POST "$PRODUCTION_BASE_URL/mcp" \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"search_food","arguments":{"query":"21香草烤半雞","dataset_channel":"preview","limit":10}}}' \
            > /tmp/sheet-search.json
          EXPECTED_VERSION="$expected_version" node --input-type=module -e '
            import fs from "node:fs";
            const body = JSON.parse(fs.readFileSync("/tmp/sheet-search.json", "utf8"));
            const content = body?.result?.structuredContent;
            if (content?.dataset_channel !== "preview" || content?.dataset_version !== process.env.EXPECTED_VERSION) throw new Error("preview search dataset mismatch");
            const imported = content?.results?.find((item) => item.food_id === "food:tw:menu:google-sheet:nut-00001");
            if (!imported || imported.status !== "draft") throw new Error("Google Sheet NUT-00001 missing from production preview");
          '

          printf '%s\n' "$expected_version" > /tmp/verified-version
          printf '%s\n' "$expected_count" > /tmp/verified-stable-count
          printf '%s\n' "$expected_preview_count" > /tmp/verified-preview-count

      - name: Clean one-time verification files after success
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat /tmp/verified-version)"
          stable="$(cat /tmp/verified-stable-count)"
          preview="$(cat /tmp/verified-preview-count)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/verify-production-sync-once.yml \
            .github/production-sync-trigger \
            .github/workflows/verify-production-sync-final.yml \
            .github/production-sync-final-trigger
          git commit -m "chore: verified production sync ${version} stable=${stable} preview=${preview}"
          git push origin HEAD:main
