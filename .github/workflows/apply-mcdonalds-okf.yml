name: Apply McDonald's OKF import

on:
  pull_request:
    paths:
      - ".github/workflows/apply-mcdonalds-okf.yml"
      - ".github/import/mcdonalds-okf.part*"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply generated OKF import
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/mcdonalds-okf.part* | base64 -d > /tmp/mcdonalds-okf.tar.xz
          tar -xJf /tmp/mcdonalds-okf.tar.xz
          rm -f .github/workflows/inspect-repo.yml
          rm -f .github/workflows/apply-mcdonalds-okf.yml
          rm -rf .github/import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add McDonald's preview OKF dataset"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
