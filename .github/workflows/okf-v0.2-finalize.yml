name: Finalize OKF v0.2

on:
  push:
    branches:
      - chore/okf-v0.2-conformance
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip okf-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out conformance branch
        uses: actions/checkout@v4
        with:
          ref: chore/okf-v0.2-conformance
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format and prove idempotency
        shell: bash
        run: |
          set -euo pipefail
          npm run format:okf
          git diff --binary > /tmp/first.diff
          npm run format:okf
          git diff --binary > /tmp/second.diff
          cmp /tmp/first.diff /tmp/second.diff

      - name: Validate and test
        run: |
          npm run validate:data
          npm test

      - name: Remove one-time workflow
        run: rm -f .github/workflows/okf-v0.2-finalize.yml

      - name: Commit final conformance changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: finalize OKF v0.2 conformance [skip okf-finalize]"
          git push origin HEAD:chore/okf-v0.2-conformance
