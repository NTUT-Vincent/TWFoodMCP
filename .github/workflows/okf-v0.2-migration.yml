name: Normalize OKF v0.2

on:
  push:
    branches:
      - chore/okf-v0.2-conformance
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip okf-format]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/okf-v0.2-conformance
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Normalize all OKF concepts
        run: node scripts/format-okf-v0.2.mjs

      - name: Validate and test
        run: |
          npm run validate:data
          npm test

      - name: Remove one-time migration workflow
        run: rm -f .github/workflows/okf-v0.2-migration.yml

      - name: Commit normalized bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: normalize OKF bundle to v0.2 [skip okf-format]"
          git push origin HEAD:chore/okf-v0.2-conformance
