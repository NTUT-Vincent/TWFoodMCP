name: verify-production-sync-once

on:
  push:
    branches:
      - main
    paths:
      - ".github/production-sync-trigger"

permissions:
  contents: write

concurrency:
  group: production-dataset
  cancel-in-progress: false

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATASET_VERSION: git-${{ github.sha }}
      PRODUCTION_BASE_URL: https://okf-mcp.vincent930093.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate:data
      - run: npm run check:links
      - run: npm test
      - run: npm run build:dataset

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required."
            exit 1
          fi

      - name: Apply D1 migrations
        run: npm run migrate:dataset

      - name: Synchronize stable and preview datasets to D1
        run: npm run publish:dataset

      - name: Deploy D1-backed Worker
        run: npm run deploy

      - name: Verify production dataset and MCP readback
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(cat dist/d1/current-version.txt)"
          expected_count="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("dist/d1/manifest.json", "utf8")).stable_documents)')"
          expected_preview_count="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("dist/d1/preview-manifest.json", "utf8")).preview_documents)')"

          for attempt in {1..12}; do
            stable_ok=false
            preview_ok=false
            if curl --fail --silent --show-error "$PRODUCTION_BASE_URL/dataset" > /tmp/dataset.json; then
              if EXPECTED_VERSION="$expected_version" EXPECTED_COUNT="$expected_count" node --input-type=module -e '
                import fs from "node:fs";
                const body = JSON.parse(fs.readFileSync("/tmp/dataset.json", "utf8"));
                if (body.dataset_channel !== "stable" || body.dataset_version !== process.env.EXPECTED_VERSION || body.stable_documents !== Number(process.env.EXPECTED_COUNT)) process.exit(1);
              '; then stable_ok=true; fi
            fi
            if curl --fail --silent --show-error "$PRODUCTION_BASE_URL/dataset?channel=preview" > /tmp/preview-dataset.json; then
              if EXPECTED_VERSION="$expected_version" EXPECTED_PREVIEW_COUNT="$expected_preview_count" node --input-type=module -e '
                import fs from "node:fs";
                const body = JSON.parse(fs.readFileSync("/tmp/preview-dataset.json", "utf8"));
                if (body.dataset_channel !== "preview" || body.dataset_version !== process.env.EXPECTED_VERSION || body.preview_documents !== Number(process.env.EXPECTED_PREVIEW_COUNT)) process.exit(1);
              '; then preview_ok=true; fi
            fi
            if [[ "$stable_ok" == "true" && "$preview_ok" == "true" ]]; then break; fi
            if [[ "$attempt" == "12" ]]; then
              echo "Production datasets did not converge to $expected_version" >&2
              cat /tmp/dataset.json 2>/dev/null || true
              cat /tmp/preview-dataset.json 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done

          curl --fail --silent --show-error \
            -X POST "$PRODUCTION_BASE_URL/mcp" \
            -H "content-type: application/json" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"production-sync-verifier","version":"1.0.0"}}}' \
            > /tmp/initialize.json
          grep -q '"name":"TWFoodMCP"' /tmp/initialize.json
          grep -q '"protocolVersion":"2025-06-18"' /tmp/initialize.json

          curl --fail --silent --show-error \
            -X POST "$PRODUCTION_BASE_URL/mcp" \
            -H "content-type: application/json" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"search_food","arguments":{"query":"Fami","limit":10}}}' \
            > /tmp/search.json
          EXPECTED_VERSION="$expected_version" node --input-type=module -e '
            import fs from "node:fs";
            const body = JSON.parse(fs.readFileSync("/tmp/search.json", "utf8"));
            const content = body?.result?.structuredContent;
            if (content?.dataset_version !== process.env.EXPECTED_VERSION) throw new Error("search returned the wrong dataset version");
            if (!Array.isArray(content?.results) || content.results.length < 1) throw new Error("search_food returned no Fami results");
          '

          curl --fail --silent --show-error \
            -X POST "$PRODUCTION_BASE_URL/mcp" \
            -H "content-type: application/json" \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"search_food","arguments":{"query":"大麥克","brand":"McDonald\u0027s","dataset_channel":"preview","limit":10}}}' \
            > /tmp/preview-search.json
          EXPECTED_VERSION="$expected_version" node --input-type=module -e '
            import fs from "node:fs";
            const body = JSON.parse(fs.readFileSync("/tmp/preview-search.json", "utf8"));
            const content = body?.result?.structuredContent;
            if (content?.dataset_channel !== "preview" || content?.dataset_version !== process.env.EXPECTED_VERSION) throw new Error("preview search returned the wrong dataset");
            const bigMac = content?.results?.find((item) => item.food_id === "food:tw:menu:mcdonalds:big-mac");
            if (!bigMac || bigMac.status !== "draft") throw new Error("preview search did not return the McDonald's Big Mac draft");
          '

          curl --fail --silent --show-error \
            -X POST "$PRODUCTION_BASE_URL/mcp" \
            -H "content-type: application/json" \
            --data '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"search_food","arguments":{"query":"21香草烤半雞","dataset_channel":"preview","limit":10}}}' \
            > /tmp/google-sheet-preview-search.json
          EXPECTED_VERSION="$expected_version" node --input-type=module -e '
            import fs from "node:fs";
            const body = JSON.parse(fs.readFileSync("/tmp/google-sheet-preview-search.json", "utf8"));
            const content = body?.result?.structuredContent;
            if (content?.dataset_channel !== "preview" || content?.dataset_version !== process.env.EXPECTED_VERSION) throw new Error("Google Sheet preview search returned the wrong dataset");
            const imported = content?.results?.find((item) => item.food_id === "food:tw:menu:google-sheet:nut-00001");
            if (!imported || imported.status !== "draft") throw new Error("Google Sheet observation NUT-00001 is missing from production preview");
          '

          echo "Verified production dataset and MCP readback: $expected_version stable=$expected_count preview=$expected_preview_count"
          printf '%s\n' "$expected_version" > /tmp/verified-version.txt
          printf '%s\n' "$expected_count" > /tmp/verified-stable-count.txt
          printf '%s\n' "$expected_preview_count" > /tmp/verified-preview-count.txt

      - name: Remove one-time verifier and record success
        shell: bash
        run: |
          set -euo pipefail
          verified_version="$(cat /tmp/verified-version.txt)"
          stable_count="$(cat /tmp/verified-stable-count.txt)"
          preview_count="$(cat /tmp/verified-preview-count.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/verify-production-sync-once.yml .github/production-sync-trigger
          git commit -m "chore: verify production sync ${verified_version} (stable=${stable_count}, preview=${preview_count})"
          git push origin HEAD:main
