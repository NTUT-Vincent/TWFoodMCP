name: Scrape McDonald's Taiwan nutrition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/scrape-mcdonalds-tw-api-v2.mjs
      - scripts/diagnose-mcdonalds-api-response.mjs
      - .github/workflows/mcdonalds-scrape.yml

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Crawl official McDonald's Taiwan nutrition API
        run: |
          mkdir -p artifacts
          node scripts/scrape-mcdonalds-tw-api-v2.mjs \
            --output artifacts/mcdonalds-tw-nutrition.api.raw.json

      - name: Capture one raw API response for diagnostics
        if: always()
        run: node scripts/diagnose-mcdonalds-api-response.mjs

      - name: Upload raw snapshot for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcdonalds-tw-nutrition-api-raw
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 14
