name: publish-dataset

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "knowledge/**"
      - "references/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "worker/**"
      - ".github/workflows/publish-dataset.yml"

permissions:
  contents: read

concurrency:
  group: production-dataset
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATASET_VERSION: git-${{ github.sha }}
      PRODUCTION_BASE_URL: https://okf-mcp.vincent930093.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate:data
      - run: npm test
      - run: npm run build:dataset

      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dataset was built but not published. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
          fi

      - name: Deploy Worker compatible with stable and preview datasets
        if: steps.credentials.outputs.available == 'true'
        run: npm run deploy

      - name: Publish versioned entries and switch stable and preview datasets
        if: steps.credentials.outputs.available == 'true'
        run: npm run publish:dataset

      - name: Verify production stable and preview datasets
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(cat dist/kv/current-version.txt)"
          expected_count="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("dist/kv/manifest.json", "utf8")).stable_documents)')"
          expected_preview_count="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("dist/kv/preview-manifest.json", "utf8")).preview_documents)')"

          for attempt in {1..12}; do
            stable_ok=false
            preview_ok=false
            if curl --fail --silent --show-error "$PRODUCTION_BASE_URL/dataset" > /tmp/dataset.json; then
              if EXPECTED_VERSION="$expected_version" EXPECTED_COUNT="$expected_count" node --input-type=module -e '
                import fs from "node:fs";
                const body = JSON.parse(fs.readFileSync("/tmp/dataset.json", "utf8"));
                if (body.dataset_channel !== "stable" || body.dataset_version !== process.env.EXPECTED_VERSION || body.stable_documents !== Number(process.env.EXPECTED_COUNT)) process.exit(1);
              '; then stable_ok=true; fi
            fi
            if curl --fail --silent --show-error "$PRODUCTION_BASE_URL/dataset?channel=preview" > /tmp/preview-dataset.json; then
              if EXPECTED_VERSION="$expected_version" EXPECTED_PREVIEW_COUNT="$expected_preview_count" node --input-type=module -e '
                import fs from "node:fs";
                const body = JSON.parse(fs.readFileSync("/tmp/preview-dataset.json", "utf8"));
                if (body.dataset_channel !== "preview" || body.dataset_version !== process.env.EXPECTED_VERSION || body.preview_documents !== Number(process.env.EXPECTED_PREVIEW_COUNT)) process.exit(1);
              '; then preview_ok=true; fi
            fi
            if [[ "$stable_ok" == "true" && "$preview_ok" == "true" ]]; then break; fi
            if [[ "$attempt" == "12" ]]; then
              echo "Production datasets did not converge to $expected_version" >&2
              cat /tmp/dataset.json 2>/dev/null || true
              cat /tmp/preview-dataset.json 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done

          curl --fail --silent --show-error \
            -X POST "$PRODUCTION_BASE_URL/mcp" \
            -H "content-type: application/json" \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"search_food","arguments":{"query":"Fami","limit":10}}}' \
            > /tmp/search.json

          EXPECTED_VERSION="$expected_version" node --input-type=module -e '
            import fs from "node:fs";
            const body = JSON.parse(fs.readFileSync("/tmp/search.json", "utf8"));
            const content = body?.result?.structuredContent;
            if (content?.dataset_version !== process.env.EXPECTED_VERSION) throw new Error("search returned the wrong dataset version");
            if (!Array.isArray(content?.results) || content.results.length < 1) throw new Error("search_food returned no Fami results");
          '

          curl --fail --silent --show-error \
            -X POST "$PRODUCTION_BASE_URL/mcp" \
            -H "content-type: application/json" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"search_food","arguments":{"query":"大麥克","brand":"McDonald\u0027s","dataset_channel":"preview","limit":10}}}' \
            > /tmp/preview-search.json

          EXPECTED_VERSION="$expected_version" node --input-type=module -e '
            import fs from "node:fs";
            const body = JSON.parse(fs.readFileSync("/tmp/preview-search.json", "utf8"));
            const content = body?.result?.structuredContent;
            if (content?.dataset_channel !== "preview" || content?.dataset_version !== process.env.EXPECTED_VERSION) throw new Error("preview search returned the wrong dataset");
            const bigMac = content?.results?.find((item) => item.food_id === "food:tw:menu:mcdonalds:big-mac");
            if (!bigMac || bigMac.status !== "draft") throw new Error("preview search did not return the McDonald's Big Mac draft");
          '

          echo "Verified stable and preview dataset $expected_version in production."
