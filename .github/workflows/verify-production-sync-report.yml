name: verify-production-sync-report

on:
  push:
    branches:
      - main
    paths:
      - ".github/production-sync-report-trigger"

permissions:
  contents: write

concurrency:
  group: production-dataset
  cancel-in-progress: true

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATASET_VERSION: git-${{ github.sha }}
      PRODUCTION_BASE_URL: https://okf-mcp.vincent930093.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate:data
      - run: npm run check:links
      - run: npm test
      - run: npm run build:dataset

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Publish current dataset and deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          npm run migrate:dataset
          npm run publish:dataset
          npm run deploy

      - name: Verify production stable preview and MCP
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(cat dist/d1/current-version.txt)"
          stable_count="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("dist/d1/manifest.json", "utf8")).stable_documents)')"
          preview_count="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("dist/d1/preview-manifest.json", "utf8")).preview_documents)')"

          for attempt in {1..12}; do
            stable_ok=false
            preview_ok=false
            if curl -fsS --max-time 15 "$PRODUCTION_BASE_URL/dataset" > /tmp/stable.json; then
              if EXPECTED_VERSION="$expected_version" EXPECTED_COUNT="$stable_count" node --input-type=module -e '
                import fs from "node:fs";
                const x=JSON.parse(fs.readFileSync("/tmp/stable.json","utf8"));
                if(x.dataset_channel!=="stable"||x.dataset_version!==process.env.EXPECTED_VERSION||x.stable_documents!==Number(process.env.EXPECTED_COUNT))process.exit(1);
              '; then stable_ok=true; fi
            fi
            if curl -fsS --max-time 15 "$PRODUCTION_BASE_URL/dataset?channel=preview" > /tmp/preview.json; then
              if EXPECTED_VERSION="$expected_version" EXPECTED_COUNT="$preview_count" node --input-type=module -e '
                import fs from "node:fs";
                const x=JSON.parse(fs.readFileSync("/tmp/preview.json","utf8"));
                if(x.dataset_channel!=="preview"||x.dataset_version!==process.env.EXPECTED_VERSION||x.preview_documents!==Number(process.env.EXPECTED_COUNT))process.exit(1);
              '; then preview_ok=true; fi
            fi
            if [[ "$stable_ok" == true && "$preview_ok" == true ]]; then break; fi
            if [[ "$attempt" == 12 ]]; then exit 1; fi
            sleep 10
          done

          curl -fsS --max-time 15 -X POST "$PRODUCTION_BASE_URL/mcp" \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"production-sync-verifier","version":"1.0.0"}}}' \
            > /tmp/init.json
          grep -q '"name":"TWFoodMCP"' /tmp/init.json

          curl -fsS --max-time 15 -X POST "$PRODUCTION_BASE_URL/mcp" \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"search_food","arguments":{"query":"21香草烤半雞","dataset_channel":"preview","limit":10}}}' \
            > /tmp/sheet.json
          EXPECTED_VERSION="$expected_version" node --input-type=module -e '
            import fs from "node:fs";
            const x=JSON.parse(fs.readFileSync("/tmp/sheet.json","utf8"));
            const c=x?.result?.structuredContent;
            if(c?.dataset_channel!=="preview"||c?.dataset_version!==process.env.EXPECTED_VERSION)throw new Error("preview dataset mismatch");
            const item=c?.results?.find(v=>v.food_id==="food:tw:menu:google-sheet:nut-00001");
            if(!item||item.status!=="draft")throw new Error("Google Sheet NUT-00001 missing");
          '

          printf '%s\n' "$expected_version" > /tmp/version
          printf '%s\n' "$stable_count" > /tmp/stable-count
          printf '%s\n' "$preview_count" > /tmp/preview-count

      - name: Record success and clean temporary files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat /tmp/version)"
          stable="$(cat /tmp/stable-count)"
          preview="$(cat /tmp/preview-count)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git rm --ignore-unmatch \
            .github/workflows/verify-production-sync-once.yml \
            .github/production-sync-trigger \
            .github/workflows/verify-production-sync-final.yml \
            .github/production-sync-final-trigger \
            .github/workflows/verify-production-sync-report.yml \
            .github/production-sync-report-trigger
          cat > .github/production-sync-result.txt <<EOF
          status=success
          run_id=${{ github.run_id }}
          dataset_version=${version}
          stable_documents=${stable}
          preview_documents=${preview}
          verified_google_sheet_food_id=food:tw:menu:google-sheet:nut-00001
          EOF
          git add .github/production-sync-result.txt
          git commit -m "chore: record verified production dataset sync"
          git push origin HEAD:main

      - name: Record failure for diagnosis and clean temporary files
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git rm --ignore-unmatch \
            .github/workflows/verify-production-sync-once.yml \
            .github/production-sync-trigger \
            .github/workflows/verify-production-sync-final.yml \
            .github/production-sync-final-trigger \
            .github/workflows/verify-production-sync-report.yml \
            .github/production-sync-report-trigger
          cat > .github/production-sync-result.txt <<EOF
          status=failure
          run_id=${{ github.run_id }}
          trigger_sha=${{ github.sha }}
          EOF
          git add .github/production-sync-result.txt
          git commit -m "chore: record failed production dataset sync"
          git push origin HEAD:main
