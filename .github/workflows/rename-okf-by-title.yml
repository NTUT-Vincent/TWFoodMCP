name: One-shot rename OKF files by title

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rename-okf-by-title.yml

permissions:
  contents: write

concurrency:
  group: one-shot-rename-okf-by-title
  cancel-in-progress: false

jobs:
  rename-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preview rename plan
        run: python scripts/rename_okf_by_title.py --dry-run

      - name: Rename OKF files and update indexes
        run: python scripts/rename_okf_by_title.py --apply

      - name: Validate filenames and index links
        run: python scripts/rename_okf_by_title.py --check

      - name: Check patch integrity
        run: git diff --check

      - name: Remove this one-shot workflow
        run: rm .github/workflows/rename-okf-by-title.yml

      - name: Commit only after validation succeeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A knowledge/menu-items .github/workflows/rename-okf-by-title.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No data changes; workflow cleanup already complete."
            exit 0
          fi
          git commit -m "chore(okf): rename files from titles and update indexes"
          git push origin HEAD:main
