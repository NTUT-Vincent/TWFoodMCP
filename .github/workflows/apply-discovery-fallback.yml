name: Apply discovery fallback

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .patches/discovery-fallback.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-all-records-20260802
          fetch-depth: 0
      - name: Patch preview fallback and explicit stable regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('worker/src/index.ts')
          source = index_path.read_text()
          start_marker = '    const status = discoveryStatus(args);'
          end_marker = '    if (name === "search_food") {'
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = '''    const status = discoveryStatus(args);
            let channel = discoveryChannel(status);
            let loaded: { manifest: DatasetManifest; foods: RuntimeFood[] };
            try {
              loaded = await loadFoods(env, channel);
            } catch (caught) {
              const message = caught instanceof Error ? caught.message : "";
              const previewUnavailable = channel === "preview"
                && (message === "dataset:preview is not configured" || /^preview-manifest:.+ was not found$/u.test(message));
              if (status !== "all" || !previewUnavailable) throw caught;
              channel = "stable";
              loaded = await loadFoods(env, channel);
            }
            const { manifest, foods } = loaded;
            const readable = (food: RuntimeFood) =>
              food.status !== "deprecated" && (status === "all" || food.status === status);

          '''
          index_path.write_text(source[:start] + replacement + source[end:])

          test_path = Path('tests/mcdonalds-preview.test.mjs')
          test_source = test_path.read_text()
          old_title = 'test("stable search does not expose McDonald\'s draft records", async () => {'
          new_title = 'test("status stable does not expose McDonald\'s draft records", async () => {'
          old_call = '  const body = await callTool("search_food", { query: "大麥克" });'
          new_call = '  const body = await callTool("search_food", { query: "大麥克", status: "stable" });'
          if test_source.count(old_title) != 1 or test_source.count(old_call) != 1:
              raise SystemExit('expected one McDonald stable search test')
          test_path.write_text(test_source.replace(old_title, new_title).replace(old_call, new_call))
          PY
      - name: Commit runtime compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .patches/discovery-fallback.trigger
          git add worker/src/index.ts tests/mcdonalds-preview.test.mjs
          git diff --cached --check
          git commit -m "fix: fall back to stable when preview is unavailable [skip ci]"
          git push origin HEAD:feat/search-all-records-20260802
