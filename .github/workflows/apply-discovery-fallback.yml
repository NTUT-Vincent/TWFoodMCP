name: Apply discovery fallback

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .patches/discovery-fallback.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-all-records-20260802
          fetch-depth: 0
      - name: Patch preview fallback and explicit stable regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('worker/src/index.ts')
          source = index_path.read_text()
          pattern = re.compile(
              r'  if \(name === "search_food" \|\| name === "get_food"\) \{\n'
              r'\s+const status = discoveryStatus\(args\);\n'
              r'\s+const channel = discoveryChannel\(status\);\n'
              r'\s+const \{ manifest, foods \} = await loadFoods\(env, channel\);\n'
              r'\s+const readable = \(food: RuntimeFood\) =>\n'
          )
          replacement = '''  if (name === "search_food" || name === "get_food") {
            const status = discoveryStatus(args);
            let channel = discoveryChannel(status);
            let loaded: { manifest: DatasetManifest; foods: RuntimeFood[] };
            try {
              loaded = await loadFoods(env, channel);
            } catch (caught) {
              const message = caught instanceof Error ? caught.message : "";
              const previewUnavailable = channel === "preview"
                && (message === "dataset:preview is not configured" || /^preview-manifest:.+ was not found$/u.test(message));
              if (status !== "all" || !previewUnavailable) throw caught;
              channel = "stable";
              loaded = await loadFoods(env, channel);
            }
            const { manifest, foods } = loaded;
            const readable = (food: RuntimeFood) =>
          '''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit('expected one search/get load block')
          index_path.write_text(source)

          test_path = Path('tests/mcdonalds-preview.test.mjs')
          test_source = test_path.read_text()
          test_pattern = re.compile(
              r'test\("stable search does not expose McDonald\'s draft records", async \(\) => \{\n'
              r'\s+const body = await callTool\("search_food", \{ query: "大麥克" \}\);\n'
          )
          test_replacement = '''test("status stable does not expose McDonald's draft records", async () => {
            const body = await callTool("search_food", { query: "大麥克", status: "stable" });
          '''
          test_source, count = test_pattern.subn(test_replacement, test_source, count=1)
          if count != 1:
              raise SystemExit('expected one McDonald stable search test')
          test_path.write_text(test_source)
          PY
      - name: Commit runtime compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .patches/discovery-fallback.trigger
          git add worker/src/index.ts tests/mcdonalds-preview.test.mjs
          git diff --cached --check
          git commit -m "fix: fall back to stable when preview is unavailable [skip ci]"
          git push origin HEAD:feat/search-all-records-20260802
