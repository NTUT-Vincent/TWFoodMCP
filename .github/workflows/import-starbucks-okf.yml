name: Import Starbucks OKF JSONL

on:
  push:
    branches:
      - starbucks-okf-import-20260804
    paths:
      - imports/starbucks-okf/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-starbucks-okf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: starbucks-okf-import-20260804
          fetch-depth: 0

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Restore and validate OKF Markdown
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import zlib
          import yaml

          source = Path('imports/starbucks-okf')
          manifest = json.loads((source / 'manifest.json').read_text(encoding='utf-8'))
          if manifest.get('format') != 'okf-jsonl-zlib-b85-v1':
              raise SystemExit('Unsupported manifest format')

          encoded = ''.join((source / name).read_text(encoding='ascii') for name in manifest['parts'])
          raw = zlib.decompress(base64.b85decode(encoded.encode('ascii')))
          digest = hashlib.sha256(raw).hexdigest()
          if digest != manifest['sha256']:
              raise SystemExit(f'Checksum mismatch: {digest}')

          records = [json.loads(line) for line in raw.decode('utf-8').splitlines() if line.strip()]
          if len(records) != manifest['count']:
              raise SystemExit(f'Expected {manifest["count"]} records, found {len(records)}')

          allowed_root = Path('knowledge/menu-items/starbucks')
          seen = set()
          for record in records:
              path = Path(record['path'])
              if path in seen:
                  raise SystemExit(f'Duplicate path: {path}')
              seen.add(path)
              if path.suffix != '.md' or allowed_root not in path.parents:
                  raise SystemExit(f'Invalid output path: {path}')

              text = record['content']
              if not text.startswith('---\n'):
                  raise SystemExit(f'{path}: missing YAML frontmatter')
              _, frontmatter, _ = text.split('---', 2)
              data = yaml.safe_load(frontmatter)
              if not isinstance(data, dict) or not data.get('type'):
                  raise SystemExit(f'{path}: missing required type')

              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')

          print(f'Restored and validated {len(records)} Starbucks OKF files')
          PY

      - name: Commit every file separately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -d '' files < <(
            find knowledge/menu-items/starbucks -type f -name '*.md' -print0 | sort -z
          )

          total=${#files[@]}
          current=0
          committed=0
          for file in "${files[@]}"; do
            current=$((current + 1))
            git add -- "$file"
            if git diff --cached --quiet -- "$file"; then
              continue
            fi
            name=$(basename "$file" .md)
            git commit -m "Add Starbucks OKF ${current}/${total}: ${name}"
            committed=$((committed + 1))
          done
          echo "Created ${committed} individual commits"

      - name: Remove import transport files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r imports/starbucks-okf
          git rm .github/workflows/import-starbucks-okf.yml
          git commit -m "Remove Starbucks OKF import transport"

      - name: Push import commits
        run: git push origin HEAD:starbucks-okf-import-20260804
