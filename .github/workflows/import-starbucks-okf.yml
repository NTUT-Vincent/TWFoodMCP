name: Import Starbucks OKF Markdown

on:
  push:
    branches:
      - starbucks-okf-import-20260804
    paths:
      - imports/starbucks-okf/import_payload.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-starbucks-okf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: starbucks-okf-import-20260804
          fetch-depth: 0

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Write OKF Markdown files
        run: python imports/starbucks-okf/import_payload.py

      - name: Validate OKF concepts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path('knowledge/menu-items/starbucks')
          files = sorted(root.rglob('*.md'))
          if len(files) != 279:
              raise SystemExit(f'Expected 279 OKF files, found {len(files)}')

          for path in files:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  raise SystemExit(f'{path}: missing YAML frontmatter')
              _, frontmatter, _ = text.split('---', 2)
              data = yaml.safe_load(frontmatter)
              if not isinstance(data, dict) or not data.get('type'):
                  raise SystemExit(f'{path}: missing required type')

          print(f'Validated {len(files)} Starbucks OKF concepts')
          PY

      - name: Commit every concept separately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -d '' files < <(
            find knowledge/menu-items/starbucks -type f -name '*.md' -print0 | sort -z
          )

          total=${#files[@]}
          current=0
          committed=0

          for file in "${files[@]}"; do
            current=$((current + 1))
            git add -- "$file"
            if git diff --cached --quiet -- "$file"; then
              continue
            fi
            name=$(basename "$file" .md)
            git commit -m "Add Starbucks OKF ${current}/${total}: ${name}"
            committed=$((committed + 1))
          done

          echo "Created ${committed} individual commits"

      - name: Push import commits
        run: git push origin HEAD:starbucks-okf-import-20260804
