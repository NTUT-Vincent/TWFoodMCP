name: Import and validate Starbucks Taiwan OKF

on:
  push:
    branches:
      - starbucks-okf-import-20260804
    paths:
      - imports/starbucks-okf/**
      - .github/workflows/import-starbucks-okf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-starbucks-okf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: starbucks-okf-import-20260804
          fetch-depth: 0

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Restore locally generated OKF bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import shutil
          import zlib

          source = Path('imports/starbucks-okf')
          manifest = json.loads((source / 'manifest.json').read_text(encoding='utf-8'))
          if manifest.get('format') != 'okf-jsonl-zlib-base85-v1':
              raise SystemExit('Unsupported import format')

          encoded = ''.join(
              (source / name).read_text(encoding='ascii')
              for name in manifest['parts']
          )
          raw = zlib.decompress(base64.b85decode(encoded.encode('ascii')))
          digest = hashlib.sha256(raw).hexdigest()
          if digest != manifest['sha256']:
              raise SystemExit(f'Payload SHA-256 mismatch: {digest}')

          records = [
              json.loads(line)
              for line in raw.decode('utf-8').splitlines()
              if line.strip()
          ]
          if len(records) != manifest['count']:
              raise SystemExit(
                  f"Payload count mismatch: expected {manifest['count']}, got {len(records)}"
              )

          root = Path('knowledge/menu-items/starbucks')
          prefix = 'knowledge/menu-items/starbucks/'
          shutil.rmtree(root, ignore_errors=True)

          seen = set()
          for record in records:
              relative = record.get('path')
              content = record.get('content')
              if not isinstance(relative, str) or not relative.startswith(prefix):
                  raise SystemExit(f'Unsafe import path: {relative!r}')
              if relative in seen:
                  raise SystemExit(f'Duplicate import path: {relative}')
              seen.add(relative)
              path = Path(relative)
              if path.suffix not in {'.md', '.txt'}:
                  raise SystemExit(f'Unsupported import file type: {path}')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')

          print(f'Restored {len(records)} locally generated Starbucks files')
          PY

      - name: Validate OKF v0.2 and nutrition quality gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml

          root = Path('knowledge/menu-items/starbucks')
          errors = []
          concepts = []
          valid_status = {'draft', 'stable', 'deprecated'}

          for path in sorted(root.rglob('*.md')):
              rel = path.relative_to(root)
              text = path.read_text(encoding='utf-8')

              if path.name == 'index.md':
                  if rel == Path('index.md'):
                      if not text.startswith('---\n'):
                          errors.append('index.md: missing okf_version frontmatter')
                      else:
                          _, frontmatter, _ = text.split('---', 2)
                          metadata = yaml.safe_load(frontmatter) or {}
                          if metadata != {'okf_version': '0.2'}:
                              errors.append(f'index.md: invalid root frontmatter {metadata!r}')
                  elif text.startswith('---\n'):
                      errors.append(f'{rel}: non-root index.md must not have frontmatter')
                  continue

              if path.name == 'log.md':
                  if text.startswith('---\n'):
                      errors.append(f'{rel}: log.md must not have frontmatter')
                  continue

              if not text.startswith('---\n'):
                  errors.append(f'{rel}: missing frontmatter')
                  continue

              try:
                  _, frontmatter, _ = text.split('---', 2)
                  data = yaml.safe_load(frontmatter)
              except Exception as exc:
                  errors.append(f'{rel}: invalid YAML: {exc}')
                  continue

              concepts.append((rel, data))
              if not isinstance(data, dict) or not data.get('type'):
                  errors.append(f'{rel}: missing type')
                  continue

              if data.get('status', 'stable') not in valid_status:
                  errors.append(f'{rel}: invalid status {data.get("status")!r}')

              generated = data.get('generated')
              if not isinstance(generated, dict) or not generated.get('by') or not generated.get('at'):
                  errors.append(f'{rel}: missing generated.by/at')

              for source in data.get('sources', []) or []:
                  if not source.get('resource'):
                      errors.append(f'{rel}: source missing resource')
                  if 'last_modified' in source:
                      errors.append(f'{rel}: source.last_modified must not contain retrieval date')

              quality = data.get('quality') or {}
              if quality.get('calculation_allowed') is True:
                  if data.get('status') != 'stable' or not data.get('verified'):
                      errors.append(f'{rel}: calculation requires stable + verified')
                  servings = (data.get('nutrition') or {}).get('servings')
                  if not isinstance(servings, list) or not servings:
                      errors.append(f'{rel}: calculation requires nutrition.servings')
                  else:
                      seen_sizes = set()
                      for serving in servings:
                          size = serving.get('size')
                          if not size or size in seen_sizes:
                              errors.append(f'{rel}: duplicate or missing serving size')
                          seen_sizes.add(size)
                          for key in ('calories_kcal', 'sugar_g', 'caffeine_mg'):
                              value = serving.get(key)
                              if not isinstance(value, (int, float)) or value < 0:
                                  errors.append(f'{rel}: invalid {key} for {size}')
              elif data.get('status') == 'stable' and rel.parts[0] == 'drinks':
                  errors.append(f'{rel}: catalog-only drink must remain draft')

          drinks = [(path, data) for path, data in concepts if path.parts and path.parts[0] == 'drinks']
          foods = [(path, data) for path, data in concepts if path.parts and path.parts[0] == 'foods']
          ready = [
              (path, data)
              for path, data in drinks
              if (data.get('quality') or {}).get('calculation_allowed') is True
          ]

          if len(drinks) != 198:
              errors.append(f'expected 198 drinks, found {len(drinks)}')
          if len(ready) != 7:
              errors.append(f'expected 7 calculation-ready drinks, found {len(ready)}')
          if foods:
              errors.append(f'food OCR must be quarantined, found {len(foods)} food concepts')

          ids = {}
          for path, data in drinks:
              food_id = (data.get('food') or {}).get('id')
              if not food_id:
                  errors.append(f'{path}: missing food.id')
              elif food_id in ids:
                  errors.append(f'{path}: duplicate food.id with {ids[food_id]}')
              else:
                  ids[food_id] = path

          raw_files = list((root / 'raw').glob('*.txt')) if (root / 'raw').exists() else []
          if len(raw_files) != 4:
              errors.append(f'expected 4 quarantined OCR source files, found {len(raw_files)}')

          result = {
              'concepts': len(concepts),
              'drinks': len(drinks),
              'calculation_ready': len(ready),
              'food_concepts': len(foods),
              'quarantined_source_files': len(raw_files),
              'errors': errors,
              'quality_gate_passed': not errors,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if errors:
              raise SystemExit(1)
          PY

      - name: Remove import transport
        run: rm -rf imports/starbucks-okf

      - name: Commit validated OKF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A knowledge/menu-items/starbucks imports/starbucks-okf
          if git diff --cached --quiet; then
            echo 'No Starbucks OKF changes.'
            exit 0
          fi
          git commit -m "feat: import validated Starbucks Taiwan OKF"
          git push origin HEAD:starbucks-okf-import-20260804
