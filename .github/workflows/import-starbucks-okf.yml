name: Crawl Starbucks Taiwan nutrition into OKF

on:
  push:
    branches:
      - starbucks-okf-import-20260804
    paths:
      - scripts/scrape-starbucks-tw-okf.mjs
      - .github/workflows/import-starbucks-okf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-starbucks-okf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: starbucks-okf-import-20260804
          fetch-depth: 0

      - name: Install OCR and YAML dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-tra
          python -m pip install pyyaml

      - name: Crawl official Starbucks Taiwan sources
        env:
          OUTPUT_ROOT: knowledge/menu-items/starbucks
          MAX_PRODUCTS: '500'
          DELAY_MS: '250'
        run: node scripts/scrape-starbucks-tw-okf.mjs

      - name: Validate OKF v0.2 structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path('knowledge/menu-items/starbucks')
          concept_files = sorted(
              path for path in root.rglob('*.md')
              if path.name not in {'index.md', 'log.md'}
          )
          if not concept_files:
              raise SystemExit('No Starbucks OKF concepts generated')

          errors = []
          for path in concept_files:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  errors.append(f'{path}: missing YAML frontmatter')
                  continue
              try:
                  _, frontmatter, _ = text.split('---', 2)
                  data = yaml.safe_load(frontmatter)
              except Exception as exc:
                  errors.append(f'{path}: invalid YAML: {exc}')
                  continue
              if not isinstance(data, dict) or not data.get('type'):
                  errors.append(f'{path}: missing required type')

          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated {len(concept_files)} Starbucks OKF concepts')
          PY

      - name: Commit generated dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add knowledge/menu-items/starbucks artifacts/starbucks-tw-scrape-report.json
          if git diff --cached --quiet; then
            echo 'No Starbucks dataset changes to commit.'
            exit 0
          fi

          git commit -m "feat: crawl Starbucks Taiwan official nutrition into OKF"
          git push origin HEAD:starbucks-okf-import-20260804
